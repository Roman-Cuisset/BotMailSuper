<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>You received a message!</title>
  <style>
    body {
      background: linear-gradient(135deg, #e3f0ff 0%, #b3d8fd 100%);
      font-family: 'Open Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 540px;
      margin: 40px auto;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 6px 32px rgba(30, 80, 180, 0.10);
      padding: 36px 30px 28px 30px;
      color: #23406e;
    }

    .logo {
      max-width: 110px;
      margin-bottom: 18px;
      filter: drop-shadow(0 2px 8px #b3d8fd);
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    h2 {
      color: #2176ff;
      margin-bottom: 12px;
      font-size: 1.7em;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-align: center;
    }

    .expediteur {
      margin: 18px 0 10px 0;
      font-size: 1.08em;
      color: #2b4d7e;
      text-align: center;
    }

    .message-block {
      margin: 22px 0 0 0;
      background: #f4f9ff;
      border-radius: 10px;
      padding: 18px 16px 12px 16px;
      box-shadow: 0 1px 4px rgba(33, 118, 255, 0.04);
      border: 1px solid #e3f0ff;
      max-width: 95%;
      margin-left: auto;
      margin-right: auto;
    }

    .message-content {
      color: #23406e;
      font-size: 1.13em;
      word-break: break-word;
      margin-bottom: 10px;
      width: 100%;
    }

    .attachments-block {
      margin: 20px 0 0 0;
      width: 100%;
      padding-top: 16px;
      border-top: 1px solid #d0e6fa;
    }

    .attachments-title {
      font-weight: 600;
      color: #2176ff;
      margin-bottom: 4px;
      font-size: 1.05em;
    }

    .attachments-list {
      margin: 0;
      padding: 0;
      list-style: none;
      color: #23406e;
      font-size: 0.95em;
      text-align: left;
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      gap: 8px;
    }

    .attachments-list li {
      margin: 0;
      padding: 8px 14px;
      background: #e3f0ff;
      border-radius: 8px;
      border: 1px solid #d0e6fa;
      word-break: break-all;
      display: inline-block;
    }

    .try-bot {
      margin-top: 36px;
      padding: 20px 0 0 0;
      border-top: 1px solid #d0e6fa;
      color: #3a5fa0;
      font-size: 1.07em;
      text-align: center;
    }

    .try-bot a {
      color: #2176ff;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.2s;
    }

    .try-bot a:hover {
      color: #174ea6;
      text-decoration: underline;
    }

    .footer {
      font-size: 12px;
      color: #8ba6c9;
      margin-top: 28px;
      text-align: center;
    }

    @media (max-width: 600px) {
      .container {
        padding: 18px 4vw 18px 4vw;
      }

      .message-block {
        max-width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <img
      src="https://lh3.googleusercontent.com/pw/AP1GczPMF61GI8tW1Qjh1SSmGlqKCAjy2QFiGkFRl2mrnSckQXgNDbXR5xYfhTJJdJC5BxYwoEh0I3ZmP1o8JhYVaSZTylITp9PlTbsaDX698e6olnap1KEAeLqdk_FO2MM5dxNzbIeCtkqrx9LzB14MXMY=w873-h873-s-no-gm?authuser=0"
      alt="Bot Logo" class="logo">
    <h2>📬 You received a message!</h2>
    <div class="expediteur">
      <strong>Sender:</strong>
      <span>{{expediteur}}</span>
    </div>
    <div class="message-block">
      <div class="message-content">
        <b>Message:</b><br>
        {{message_content}}
      </div>
      <div class="attachments-block">
        <div class="attachments-title">Attachments:</div>
        <ul class="attachments-list">
          {{attachments_list}}
        </ul>
      </div>
    </div>
    <div class="try-bot">
      <span>Send your files and messages by email directly from Telegram!<br>
        <a href="https://t.me/BotMailSuper_bot" target="_blank">Try the bot for free 🚀</a></span>
    </div>
    <p class="footer">© 2026 Bot Mail Super by RoK-studio</p>
  </div>
</body>

</html>
