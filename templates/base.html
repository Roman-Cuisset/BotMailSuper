<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>Bot Mail Super - Admin</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Custom CSS -->
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>

<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="text-center mb-3">
            <h3>🤖 Bot Admin</h3>
            <small style="color:#64748b; padding: 0 1.25rem; font-size: .75rem;">v3.5 — Panel</small>
        </div>
        <a href="/dashboard" class="{{ 'active' if active_page == 'dashboard' else '' }}">
            <i class="fas fa-chart-pie"></i> Dashboard
        </a>
        <a href="/users" class="{{ 'active' if active_page == 'users' else '' }}">
            <i class="fas fa-users"></i> Users
        </a>
        <a href="/logs" class="{{ 'active' if active_page == 'logs' else '' }}">
            <i class="fas fa-terminal"></i> Logs
        </a>
        <a href="/settings" class="{{ 'active' if active_page == 'settings' else '' }}">
            <i class="fas fa-cog"></i> Settings
        </a>
        <div style="flex:1;"></div>
        <a href="/logout" class="text-danger">
            <i class="fas fa-sign-out-alt"></i> Logout
        </a>
    </div>

    <!-- Main Content -->
    <div class="content">
        <!-- Top Navbar -->
        <nav class="navbar navbar-expand-lg px-0">
            <div class="container-fluid px-0">
                <span class="navbar-brand mb-0">
                    {% block title %}Dashboard{% endblock %}
                </span>
                <div class="d-flex align-items-center gap-3">
                    <span><i class="fas fa-circle text-success" style="font-size:.5rem;"></i> Admin</span>
                </div>
            </div>
        </nav>

        <!-- Page Content -->
        {% block content %}{% endblock %}
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.querySelectorAll('form[method="post"], form[method="POST"]').forEach((form) => {
            if (!form.querySelector('input[name="csrf_token"]')) {
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = 'csrf_token';
                input.value = document.querySelector('meta[name="csrf-token"]').content;
                form.appendChild(input);
            }
        });
    </script>
    {% block scripts %}{% endblock %}
</body>

</html>
